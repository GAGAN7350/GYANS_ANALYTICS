version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://gyans:gyans@db:5432/gyans_analytics}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-random-secret-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - gyans-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0
    networks:
      - gyans-network

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=gyans
      - POSTGRES_PASSWORD=gyans
      - POSTGRES_DB=gyans_analytics
    networks:
      - gyans-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gyans-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - gyans-network

networks:
  gyans-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
